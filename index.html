<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TLAPS-Bench</title>
<script>
  window.TWEAK_DEFAULTS = { "accent": "#4f8cff", "dark": false };

  (() => {
    let savedTweaks;
    try {
      savedTweaks = JSON.parse(localStorage.getItem("tlaps_tweaks"));
    } catch (e) {}

    const tweaks = savedTweaks
      ? { ...window.TWEAK_DEFAULTS, ...savedTweaks }
      : {
          ...window.TWEAK_DEFAULTS,
          dark: Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches),
        };

    window.INITIAL_TWEAKS = tweaks;
    document.documentElement.style.setProperty("--accent", tweaks.accent);
    document.documentElement.setAttribute("data-theme", tweaks.dark ? "dark" : "light");
  })();
</script>
